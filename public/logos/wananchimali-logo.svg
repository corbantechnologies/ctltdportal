<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Royal Navy Background -->
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Emerald Prosperity Gradient -->
    <linearGradient id="wm-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Shield Accent -->
    <linearGradient id="wm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Container Badge (Radius 24) -->
  <rect x="16" y="16" width="480" height="480" rx="24" ry="24" fill="url(#wm-bg)" />
  <rect x="28" y="28" width="456" height="456" rx="18" ry="18" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3" fill="none" />

  <!-- Cooperative Shield & Community Growth Emblem -->
  <g transform="translate(256, 172)">
    <!-- Security Shield Contour -->
    <path d="M 0 -80 C 45 -80 80 -65 80 -25 C 80 35 45 75 0 92 C -45 75 -80 35 -80 -25 C -80 -65 -45 -80 0 -80 Z" fill="#1e293b" stroke="url(#wm-gold)" stroke-width="3.5" />

    <!-- Community Linked Rings (3 Connected Nodes = Cooperatives) -->
    <circle cx="-32" cy="-10" r="22" stroke="url(#wm-emerald)" stroke-width="3" fill="#0f172a" fill-opacity="0.6" />
    <circle cx="32" cy="-10" r="22" stroke="url(#wm-emerald)" stroke-width="3" fill="#0f172a" fill-opacity="0.6" />
    <circle cx="0" cy="28" r="22" stroke="url(#wm-gold)" stroke-width="3" fill="#0f172a" fill-opacity="0.6" />

    <!-- Center Prosperity Tree / Pillar -->
    <path d="M -8 -30 L 0 -48 L 8 -30 L 3 -30 L 3 15 L -3 15 L -3 -30 Z" fill="url(#wm-gold)" />
    <circle cx="0" cy="-55" r="7" fill="url(#wm-gold)" />
  </g>

  <!-- Typography Brand Section -->
  <g id="brand-title">
    <text x="256" y="342" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="3" fill="#ffffff">
      WANANCHI <tspan fill="url(#wm-emerald)">MALI</tspan>
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="140" y1="370" x2="372" y2="370" stroke="url(#wm-gold)" stroke-width="2" stroke-linecap="round" />

  <!-- Subtitle -->
  <g id="brand-subtitle">
    <text x="256" y="410" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#93c5fd">
      SACCO CORE BANKING
    </text>
    <text x="256" y="434" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="4" fill="#34d399" fill-opacity="0.9">
      KENYA · COOPERATIVES &amp; M-PESA
    </text>
  </g>
</svg>
